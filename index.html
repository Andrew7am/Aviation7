<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luxury Explorers</title>
    <meta name="theme-color" content="#111C2D" />
    <!-- Inter and IBM Plex Mono: the design system's two faces. swap, so the
         screen reads in the system font for the moment the faces take. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" />
    <script>
      /* Dark or light before the first paint, so the page never flashes the other one. */
      try {
        var t = localStorage.getItem('theme');
        if (!t && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
        if (t && t !== 'light') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
